name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: satchel-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: satchel-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: satchel-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: satchel-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: satchel-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/satchel ${{ matrix.artifact }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\satchel.exe ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir release
          find artifacts -type f -exec cp {} release/ \;
          chmod +x release/satchel-*
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Install

            Download the binary for your platform from the assets below.

            **Quick start after download:**

            ```bash
            chmod +x satchel-*            # make executable (macOS/Linux)
            ./satchel-* init personal     # create a vault
            ./scripts/download-model.sh   # download the embedding model
            ./satchel-* ingest ~/notes/   # ingest your documents
            ./satchel-* serve             # start the MCP server
            ```

            See the [README](https://github.com/virgilvox/satchel#readme) for full documentation.
