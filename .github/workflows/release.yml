name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  MODEL_NAME: bge-small-en-v1.5
  MODEL_URL: https://huggingface.co/BAAI/bge-small-en-v1.5/resolve/main

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: satchel-linux-x86_64
            archive: satchel-linux-x86_64.zip
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: satchel-linux-aarch64
            archive: satchel-linux-aarch64.zip
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: satchel-macos-x86_64
            archive: satchel-macos-x86_64.zip
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: satchel-macos-aarch64
            archive: satchel-macos-aarch64.zip
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: satchel-windows-x86_64.exe
            archive: satchel-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build web bundle
        shell: bash
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build:fast

      - name: Download embedding model
        shell: bash
        run: |
          mkdir -p "vault/models/${MODEL_NAME}"
          curl -sL -o "vault/models/${MODEL_NAME}/model.safetensors" "$MODEL_URL/model.safetensors"
          curl -sL -o "vault/models/${MODEL_NAME}/tokenizer.json" "$MODEL_URL/tokenizer.json"
          curl -sL -o "vault/models/${MODEL_NAME}/config.json" "$MODEL_URL/config.json"
          ls -lh "vault/models/${MODEL_NAME}/"

      - name: Install cross-compilation tools (aarch64 Linux)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --features embed-model --target ${{ matrix.target }}

      - name: Stage binary (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/satchel ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Stage binary (windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\satchel.exe ${{ matrix.artifact }}

      - name: Pick platform icon
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *apple-darwin*) cp assets/brand/satchel.icns      satchel-icon.icns ;;
            *windows*)      cp assets/brand/satchel.ico       satchel-icon.ico  ;;
            *)              cp assets/brand/icon-256.png      satchel-icon.png  ;;
          esac
          ls -la satchel-icon.* || true

      - name: Package as zip (unix)
        if: runner.os != 'Windows'
        run: zip -j ${{ matrix.archive }} ${{ matrix.artifact }} satchel-icon.*

      - name: Package as zip (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.artifact }},satchel-icon.* -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir release
          find artifacts -type f -name '*.zip' -exec cp {} release/ \;
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Install

            Download the zip for your platform, extract, and run. The embedding model is included.

            ```bash
            unzip satchel-macos-aarch64.zip       # also Linux & x86_64 variants
            ./satchel-macos-aarch64               # launch web UI at http://localhost:7428
            ./satchel-macos-aarch64 ingest ~/notes/
            ./satchel-macos-aarch64 config        # MCP config snippet
            ```

            On Windows, double-click the .zip to extract, then run `satchel-windows-x86_64.exe`.

            On macOS the first launch may be blocked by Gatekeeper — right-click the binary in Finder and choose "Open" once to allow it.

            A default vault is created automatically on first run. See the [README](https://github.com/virgilvox/satchel#readme) for full documentation.
