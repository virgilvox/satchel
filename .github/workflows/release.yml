name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  MODEL_NAME: bge-small-en-v1.5
  MODEL_URL: https://huggingface.co/BAAI/bge-small-en-v1.5/resolve/main
  # Track Cloudflare's "latest" release. The stderr banner the tunnel
  # manager scrapes is stable across recent versions; if it ever drifts,
  # pin to a known-good tag here.
  CLOUDFLARED_BASE: https://github.com/cloudflare/cloudflared/releases/latest/download

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # All matrix entries opt into the `prod` environment so the macOS
    # builds can reach the Apple signing secrets stored there. Non-macOS
    # runs simply don't reference those secrets; the env scoping does
    # not block them.
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: satchel-linux-x86_64
            archive: satchel-linux-x86_64.zip
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: satchel-linux-aarch64
            archive: satchel-linux-aarch64.zip
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: satchel-macos-x86_64
            archive: satchel-macos-x86_64.zip
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: satchel-macos-aarch64
            archive: satchel-macos-aarch64.zip
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: satchel-windows-x86_64.exe
            archive: satchel-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build web bundle
        shell: bash
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build:fast

      - name: Download embedding model
        shell: bash
        run: |
          mkdir -p "vault/models/${MODEL_NAME}"
          curl -sL -o "vault/models/${MODEL_NAME}/model.safetensors" "$MODEL_URL/model.safetensors"
          curl -sL -o "vault/models/${MODEL_NAME}/tokenizer.json" "$MODEL_URL/tokenizer.json"
          curl -sL -o "vault/models/${MODEL_NAME}/config.json" "$MODEL_URL/config.json"
          ls -lh "vault/models/${MODEL_NAME}/"

      - name: Install cross-compilation tools (aarch64 Linux)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --features embed-model --target ${{ matrix.target }}

      # ─────────────────────────────────────────────────────────────
      # Per-platform staging. The icon story is different on each OS:
      #   Windows — already embedded in the .exe via build.rs + winresource.
      #             Just copy the .exe.
      #   macOS  — wrap the binary in a Satchel.app bundle so Finder shows
      #             the icon. Inside: Contents/MacOS/satchel + Info.plist
      #             + Resources/satchel.icns. zip with `ditto -c -k` to
      #             preserve the bundle's HFS metadata.
      #   Linux  — ship the raw binary + satchel.desktop + satchel.png.
      #             ELF binaries can't host an icon resource; the desktop
      #             entry references the PNG when the user moves the files
      #             into ~/.local/share/{applications,icons}/.
      # ─────────────────────────────────────────────────────────────

      - name: Stage binary (linux)
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        run: |
          cp target/${{ matrix.target }}/release/satchel ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}
          cp assets/brand/satchel.desktop satchel.desktop
          cp assets/brand/icon-256.png    satchel.png
          # Bundle cloudflared next to the binary so the in-UI tunnel
          # button "just works" out of the box. Linux releases ship the
          # raw single-file binary directly.
          case "${{ matrix.target }}" in
            x86_64-unknown-linux*)  CF=cloudflared-linux-amd64 ;;
            aarch64-unknown-linux*) CF=cloudflared-linux-arm64 ;;
          esac
          curl -sSL -o cloudflared "${CLOUDFLARED_BASE}/${CF}"
          chmod +x cloudflared

      # Import the Apple Developer ID Application certificate into a
      # temporary keychain on the macOS runner. Runs only when the
      # signing secrets are present in the `prod` environment; on forks
      # without these secrets, this step is a no-op and the build falls
      # back to ad-hoc signing (still launchable locally with `xattr -dr
      # com.apple.quarantine`, just not notarized).
      - name: Import Apple signing certificate (macos)
        if: startsWith(matrix.target, 'x86_64-apple-darwin') || startsWith(matrix.target, 'aarch64-apple-darwin')
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # `secrets.*` is not allowed in step `if:` conditions, so the
          # gate has to live inside the script. Skip cleanly when the
          # signing secrets aren't configured in the prod environment
          # (e.g. on forks); the staging step downstream falls back to
          # ad-hoc signing in that case.
          if [ -z "${APPLE_CERT_P12_BASE64:-}" ]; then
            echo "No APPLE_CERT_P12_BASE64 secret configured; skipping signing setup"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          CERT_PATH="$RUNNER_TEMP/devid.p12"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Prepend the temp keychain to the user search list so codesign
          # finds the identity. `tr -d '"'` strips quoting from the
          # existing list output.
          existing=$(security list-keychain -d user | tr -d '"' | xargs)
          security list-keychain -d user -s "$KEYCHAIN_PATH" $existing
          # Discover the exact identity string for later steps.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 \
            | sed -E 's/.*"(Developer ID Application:[^"]+)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::Developer ID Application identity not found in imported cert" >&2
            exit 1
          fi
          echo "Found identity: $IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Stage binary (macos · .app bundle)
        if: startsWith(matrix.target, 'x86_64-apple-darwin') || startsWith(matrix.target, 'aarch64-apple-darwin')
        run: |
          APP="Satchel.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/${{ matrix.target }}/release/satchel "$APP/Contents/MacOS/satchel"
          chmod +x "$APP/Contents/MacOS/satchel"
          cp assets/brand/satchel.icns "$APP/Contents/Resources/satchel.icns"
          VERSION=$(grep -E '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>              <string>SATCHEL</string>
            <key>CFBundleDisplayName</key>       <string>SATCHEL</string>
            <key>CFBundleIdentifier</key>        <string>com.satchel.app</string>
            <key>CFBundleVersion</key>           <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundlePackageType</key>       <string>APPL</string>
            <key>CFBundleExecutable</key>        <string>satchel</string>
            <key>CFBundleIconFile</key>          <string>satchel.icns</string>
            <key>LSMinimumSystemVersion</key>    <string>10.15</string>
            <key>NSHighResolutionCapable</key>   <true/>
            <key>LSUIElement</key>               <false/>
            <!--
              Single-instance behavior is now enforced at the Rust level:
              if port 7428 is already bound, the second copy opens the
              browser to the running instance and exits cleanly. We
              previously set `LSMultipleInstancesProhibited` here, but
              that routes launches through LaunchServices, which breaks
              the standard Gatekeeper "Open Anyway" flow when the bundle
              has stale registrations from prior versions and surfaces as
              "file not found" with no recovery dialog.
            -->
          </dict>
          </plist>
          PLIST
          # Bundle cloudflared INSIDE the .app's MacOS dir so the in-UI
          # tunnel button "just works" without an external install. The
          # tunnel manager looks here first, falls back to $PATH for
          # source builds. macOS releases ship as .tgz — extract just
          # the binary.
          case "${{ matrix.target }}" in
            x86_64-apple-darwin)  CF=cloudflared-darwin-amd64.tgz ;;
            aarch64-apple-darwin) CF=cloudflared-darwin-arm64.tgz ;;
          esac
          curl -sSL -o cloudflared.tgz "${CLOUDFLARED_BASE}/${CF}"
          tar -xzf cloudflared.tgz
          mv cloudflared "$APP/Contents/MacOS/cloudflared"
          chmod +x "$APP/Contents/MacOS/cloudflared"
          rm -f cloudflared.tgz
          # Sign. Prefer Developer ID with the hardened runtime when the
          # signing identity was imported in the previous step; this is
          # the form Apple's notary service accepts. Sign nested binaries
          # first (cloudflared) so the outer .app's seal covers an already
          # valid inner signature, then sign the outer bundle. Fall back
          # to ad-hoc when no identity is configured (e.g. forks).
          if [ -n "${SIGNING_IDENTITY:-}" ]; then
            echo "Signing with Developer ID: $SIGNING_IDENTITY"
            codesign --force --options runtime --timestamp \
              --sign "$SIGNING_IDENTITY" "$APP/Contents/MacOS/cloudflared"
            codesign --force --options runtime --timestamp --deep \
              --sign "$SIGNING_IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          else
            echo "No SIGNING_IDENTITY set; ad-hoc signing"
            codesign --force --deep --sign - "$APP" || true
          fi

      - name: Stage binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          copy target\${{ matrix.target }}\release\satchel.exe ${{ matrix.artifact }}
          # Bundle cloudflared next to satchel.exe so the in-UI tunnel
          # button works without an external install.
          Invoke-WebRequest -Uri "$env:CLOUDFLARED_BASE/cloudflared-windows-amd64.exe" `
            -OutFile cloudflared.exe

      - name: Package zip (linux)
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        run: zip -j ${{ matrix.archive }} ${{ matrix.artifact }} cloudflared satchel.desktop satchel.png

      - name: Package zip (macos)
        if: startsWith(matrix.target, 'x86_64-apple-darwin') || startsWith(matrix.target, 'aarch64-apple-darwin')
        run: |
          # ditto preserves bundle metadata + the .app's executable bit;
          # plain `zip` does not.
          ditto -c -k --keepParent --sequesterRsrc Satchel.app ${{ matrix.archive }}

      # Submit the signed zip to Apple's notary service, wait for the
      # ticket, staple it onto the .app, and re-zip so the staple
      # travels in the artifact. Skipped when no signing identity was
      # configured (the previous step did ad-hoc signing in that case
      # and notarization would fail).
      - name: Notarize macOS bundle
        if: |
          (startsWith(matrix.target, 'x86_64-apple-darwin') || startsWith(matrix.target, 'aarch64-apple-darwin'))
          && env.SIGNING_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            echo "Notarization secrets missing; bundle was Developer-ID signed but will not be notarized"
            exit 0
          fi
          echo "Submitting ${{ matrix.archive }} to Apple notary service…"
          xcrun notarytool submit "${{ matrix.archive }}" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          # Staple modifies Satchel.app on disk; re-zip so the artifact
          # carries the ticket and Gatekeeper can validate offline.
          xcrun stapler staple Satchel.app
          xcrun stapler validate Satchel.app
          rm "${{ matrix.archive }}"
          ditto -c -k --keepParent --sequesterRsrc Satchel.app "${{ matrix.archive }}"
          echo "Notarized + stapled: ${{ matrix.archive }}"

      # Tear down the temp keychain so credentials don't linger on the
      # runner image (defensive; runners are ephemeral but this is good
      # hygiene). Always runs after the macOS-signing path, even on
      # earlier-step failure.
      - name: Cleanup macOS keychain
        if: |
          always()
          && (startsWith(matrix.target, 'x86_64-apple-darwin') || startsWith(matrix.target, 'aarch64-apple-darwin'))
          && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Package zip (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.artifact }},cloudflared.exe -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir release
          find artifacts -type f -name '*.zip' -exec cp {} release/ \;
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Install

            The embedding model is bundled into every binary. No separate download.

            ### macOS
            Extract the zip — you'll get `Satchel.app` with the SATCHEL icon. Drag to `/Applications` (or anywhere) and double-click. The first launch may be blocked by Gatekeeper — right-click the app in Finder and choose **Open** once to allow it.

            For terminal use: `Satchel.app/Contents/MacOS/satchel ingest ~/notes/` (or symlink it onto your `$PATH`).

            ### Windows
            Extract `satchel-windows-x86_64.zip`, double-click `satchel-windows-x86_64.exe`. The icon is embedded directly in the executable.

            ### Linux
            Extract the zip — you get the binary, `satchel.desktop`, and `satchel.png`. Either run the binary directly:

            ```bash
            chmod +x satchel-linux-x86_64
            ./satchel-linux-x86_64
            ```

            …or install the desktop entry so it shows up in your launcher with the SATCHEL icon:

            ```bash
            install -Dm755 satchel-linux-x86_64 ~/.local/bin/satchel
            install -Dm644 satchel.png ~/.local/share/icons/hicolor/256x256/apps/satchel.png
            install -Dm644 satchel.desktop ~/.local/share/applications/satchel.desktop
            update-desktop-database ~/.local/share/applications 2>/dev/null || true
            ```

            A default vault is created automatically on first run. See the [README](https://github.com/virgilvox/satchel#readme) for full documentation.
