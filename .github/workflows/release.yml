name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  MODEL_URL: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: satchel-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: satchel-linux-aarch64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: satchel-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: satchel-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: satchel-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Download embedding model
        shell: bash
        run: |
          mkdir -p vault/models/all-MiniLM-L6-v2
          curl -sL -o vault/models/all-MiniLM-L6-v2/model.safetensors "$MODEL_URL/model.safetensors"
          curl -sL -o vault/models/all-MiniLM-L6-v2/tokenizer.json "$MODEL_URL/tokenizer.json"
          curl -sL -o vault/models/all-MiniLM-L6-v2/config.json "$MODEL_URL/config.json"
          ls -lh vault/models/all-MiniLM-L6-v2/

      - name: Install cross-compilation tools (aarch64 Linux)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --features embed-model --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/satchel ${{ matrix.artifact }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\satchel.exe ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir release
          find artifacts -type f -exec cp {} release/ \;
          chmod +x release/satchel-* 2>/dev/null || true
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Install

            Download the binary for your platform. The embedding model is included;
            no additional setup required.

            ```bash
            chmod +x satchel-*          # make executable (macOS/Linux)
            ./satchel-* init personal   # create a vault
            ./satchel-* ingest ~/notes/ # ingest your documents
            ./satchel-* serve           # start the MCP server
            ```

            Or install via cargo (this builds from source without the embedded model;
            run `./scripts/download-model.sh` after install):

            ```bash
            cargo install satchel-rag
            ```

            See the [README](https://github.com/virgilvox/satchel#readme) for full documentation.
