[package]
name = "satchel-rag"
version = "2.6.0"
edition = "2021"
description = "Portable RAG system on a USB drive. Single binary, local embeddings, MCP protocol."
license = "MIT"
repository = "https://github.com/virgilvox/satchel"
homepage = "https://github.com/virgilvox/satchel"
readme = "README.md"
keywords = ["rag", "mcp", "embeddings", "portable", "knowledge-base"]
categories = ["command-line-utilities", "database", "text-processing"]
exclude = [
    "/vault",
    "/bin",
    "/npm",
    "/.github",
]

[[bin]]
name = "satchel"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/satchel-{ target }{ archive-suffix }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/satchel-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/satchel-linux-aarch64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/satchel-macos-x86_64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/satchel-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/satchel-windows-x86_64.exe"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.31", features = ["bundled"] }

candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.19"

clap = { version = "4", features = ["derive"] }

lopdf = "0.32"
zip = "2"
# CSV / TSV table-aware ingest: emit one Record per row with the header
# repeated so each chunk is self-describing for both embeddings and BM25.
# `csv` is small and well-maintained; the only dep that comes with it is
# serde already-in-tree.
csv = "1"

uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
walkdir = "2"
notify = "6"

chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
mail-parser = "0.9"
regex = "1"

# Tunnel-config persistence: tiny TOML file at <vault>/tunnel.toml. We
# don't pull in the writer (`toml::to_string`) since we hand-format on save —
# the parse side is what matters.
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }

# Anthropic API + external MCP proxy (v1.5.0). Pure rustls to keep the
# Linux musl story alive — no openssl, no system TLS. `stream` for SSE
# response bodies; `json` for typed request bodies.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[features]
default = []
embed-model = []
test-support = []
integration = ["test-support"]

[dev-dependencies]
satchel-rag = { path = ".", features = ["test-support"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
proptest = "1"
tempfile = "3"

# Windows-only: embed assets/brand/satchel.ico so the binary shows the
# SATCHEL mark in Explorer / Task Manager. macOS and Linux skip this.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
