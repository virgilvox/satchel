[package]
name = "satchel-rag"
version = "0.2.1"
edition = "2021"
description = "Portable RAG system on a USB drive. Single binary, local embeddings, MCP protocol."
license = "AGPL-3.0-only"
repository = "https://github.com/virgilvox/satchel"
homepage = "https://github.com/virgilvox/satchel"
readme = "README.md"
keywords = ["rag", "mcp", "embeddings", "portable", "knowledge-base"]
categories = ["command-line-utilities", "database", "text-processing"]
exclude = [
    "/vault",
    "/bin",
    "/npm",
    "/.github",
]

[[bin]]
name = "satchel"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/satchel-{ target }{ archive-suffix }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/satchel-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/satchel-linux-aarch64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/satchel-macos-x86_64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/satchel-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/satchel-windows-x86_64.exe"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.31", features = ["bundled"] }

candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.19"

clap = { version = "4", features = ["derive"] }

lopdf = "0.32"
zip = "2"

uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
walkdir = "2"
notify = "6"

chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
mail-parser = "0.9"
regex = "1"

[features]
default = []
embed-model = []
test-support = []
integration = ["test-support"]

[dev-dependencies]
satchel-rag = { path = ".", features = ["test-support"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
proptest = "1"
tempfile = "3"
